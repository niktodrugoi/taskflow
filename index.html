<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskFlow — простой список задач с сохранением в браузере.">
  <title>TaskFlow — список задач</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <header class="brand">
      <h1>TaskFlow</h1>
      <p>Планируй. Выполняй. Достигай.</p>
    </header>

    <main class="card">
      <div class="card__head">
        <h2>Мои задачи</h2>
        <dl class="stats">
          <div><dt>Всего</dt><dd id="stat-total">0</dd></div>
          <div><dt>Выполнено</dt><dd id="stat-done">0</dd></div>
          <div><dt>Осталось</dt><dd id="stat-left">0</dd></div>
        </dl>
      </div>

      <form id="task-form" class="add" novalidate>
        <label class="sr-only" for="task-input">Новая задача</label>
        <input id="task-input" type="text" maxlength="200" autocomplete="off" placeholder="Что нужно сделать?">
        <button type="submit" class="btn btn--primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Добавить
        </button>
      </form>
      <p id="form-error" class="form-error" role="alert" hidden></p>

      <div class="filters" role="group" aria-label="Фильтр задач">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">Все</button>
        <button type="button" class="filter" data-filter="active" aria-pressed="false">Активные</button>
        <button type="button" class="filter" data-filter="completed" aria-pressed="false">Выполненные</button>
      </div>

      <ul id="task-list" class="tasks"></ul>

      <div id="empty" class="empty" hidden>
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 9h8M8 13h5"/></svg>
        <strong id="empty-title"></strong>
        <span id="empty-text"></span>
      </div>

      <footer class="card__foot">
        <span id="left-text" aria-live="polite"></span>
        <button type="button" id="clear-btn" class="btn btn--ghost">Очистить выполненные</button>
      </footer>
    </main>
  </div>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h3 id="confirm-title">Очистить выполненные?</h3>
      <p id="confirm-text"></p>
      <div class="dialog__actions">
        <button value="cancel" class="btn btn--ghost">Отмена</button>
        <button value="ok" class="btn btn--danger">Удалить</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
